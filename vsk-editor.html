<title>VSK・VSS エディタ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+JP:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen workbench — header strip, 3D capture-volume view on the left, inspector on the right (stacks under 900px). */
:root {
  --bg: #eceff3; --panel: #fbfcfd; --panel-2: #f2f5f8; --ink: #16202b; --muted: #5a6675; --line: #d3dae2;
  --accent: #0b746f; --accent-ink: #ffffff; --accent-soft: #d8efed;
  --left: #d1611b; --right: #2c68d8; --center: #8d99a6;
  --warn: #9a6408; --warn-soft: #f8ecd2; --err: #b8322a; --err-soft: #f8dedb; --ok: #2d7a4f; --ok-soft: #dcefe3;
  --vp-bg: #1d242c; --vp-grid: rgba(255,255,255,0.06); --vp-ink: #e8edf2; --vp-muted: #9aa6b2; --vp-joint: #c3ccd5; --vp-edge: rgba(0,0,0,0.55);
  --sans: "IBM Plex Sans JP", "Hiragino Sans", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11161c; --panel: #171e25; --panel-2: #1d252d; --ink: #e2e8ee; --muted: #95a2af; --line: #2a333d;
  --accent: #34b3a8; --accent-ink: #04201e; --accent-soft: #143633;
  --left: #f08c4a; --right: #6e9dff; --center: #8692a0;
  --warn: #e2b04f; --warn-soft: #3a2f17; --err: #f07a70; --err-soft: #3b1d1b; --ok: #6cc795; --ok-soft: #173325;
  --vp-bg: #0d1217; --vp-grid: rgba(255,255,255,0.05); --vp-ink: #e8edf2; --vp-muted: #8995a2; --vp-joint: #aeb8c2; --vp-edge: rgba(0,0,0,0.6);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #11161c; --panel: #171e25; --panel-2: #1d252d; --ink: #e2e8ee; --muted: #95a2af; --line: #2a333d;
  --accent: #34b3a8; --accent-ink: #04201e; --accent-soft: #143633;
  --left: #f08c4a; --right: #6e9dff; --center: #8692a0;
  --warn: #e2b04f; --warn-soft: #3a2f17; --err: #f07a70; --err-soft: #3b1d1b; --ok: #6cc795; --ok-soft: #173325;
  --vp-bg: #0d1217; --vp-grid: rgba(255,255,255,0.05); --vp-ink: #e8edf2; --vp-muted: #8995a2; --vp-joint: #aeb8c2; --vp-edge: rgba(0,0,0,0.6);
  color-scheme: dark; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 13px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
.mono, code { font-family: var(--mono); font-size: 12px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); }
header.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--panel); border-bottom: 1px solid var(--line); }
.brand { display: flex; flex-direction: column; line-height: 1.2; margin-right: 4px; }
.brand b { font-size: 15px; font-weight: 600; letter-spacing: 0.01em; }
.brand span { font-size: 11px; color: var(--muted); }
.slots { display: flex; flex-wrap: wrap; gap: 8px; flex: 1 1 420px; min-width: 0; }
.slot { display: grid; grid-template-columns: auto minmax(0,1fr) auto; align-items: center; gap: 2px 8px; padding: 6px 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel-2); min-width: 0; flex: 1 1 200px; cursor: pointer; text-align: left; }
.slot[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--panel); }
.slot .role { font-size: 11px; color: var(--muted); grid-column: 1 / 3; }
.slot .fname { font-family: var(--mono); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; grid-column: 1 / 3; }
.slot .kind { grid-row: 1 / 3; grid-column: 3; }
.slot.empty { cursor: default; opacity: 0.7; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 99px; font-size: 11px; font-weight: 500; border: 1px solid var(--line); background: var(--panel); color: var(--muted); white-space: nowrap; }
.pill.tmpl { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); background: var(--accent-soft); }
.pill.cal { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); background: var(--warn-soft); }
.pill.req { color: var(--ink); }
.pill.opt { color: var(--muted); border-style: dashed; }
.pill.L { color: var(--left); } .pill.R { color: var(--right); }
.actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: var(--r); border: 1px solid var(--line); background: var(--panel); cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--err); border-color: color-mix(in srgb, var(--err) 50%, var(--line)); }
.btn.danger.solid { background: var(--err); color: #fff; }
.btn.small { padding: 2px 8px; font-size: 12px; }
.btn.ghost { border-color: transparent; background: transparent; }
.check { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
.check input { accent-color: var(--accent); }

main.work { display: grid; grid-template-columns: minmax(0, 1fr) minmax(380px, 480px); min-height: 0; }
.viewport { position: relative; min-height: 0; background: var(--vp-bg); }
.viewport canvas { display: block; touch-action: none; cursor: grab; }
.vp-tools { position: absolute; top: 10px; left: max(10px, env(safe-area-inset-left, 0px)); right: 10px; display: flex; flex-wrap: wrap; gap: 6px; pointer-events: none; }
.vp-tools > * { pointer-events: auto; }
.seg-ctl { display: inline-flex; border: 1px solid rgba(255,255,255,0.14); border-radius: var(--r); overflow: hidden; background: rgba(13,18,23,0.72); }
.seg-ctl button { background: transparent; border: 0; color: var(--vp-muted); padding: 4px 10px; cursor: pointer; font-size: 12px; }
.seg-ctl button[aria-pressed="true"] { color: var(--vp-ink); background: rgba(255,255,255,0.12); }
.seg-ctl label { color: var(--vp-muted); padding: 4px 10px; font-size: 12px; display: inline-flex; gap: 5px; align-items: center; cursor: pointer; }
.seg-ctl label input { accent-color: var(--accent); }
.vp-hint { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); bottom: 10px; color: var(--vp-muted); font-size: 11px; pointer-events: none; }
.vp-legend { position: absolute; right: 12px; bottom: 10px; display: flex; gap: 12px; color: var(--vp-muted); font-size: 11px; pointer-events: none; }
.vp-legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }
.tip { position: absolute; pointer-events: none; background: rgba(13,18,23,0.92); color: var(--vp-ink); padding: 4px 8px; border-radius: 4px; font-size: 12px; font-family: var(--mono); white-space: nowrap; transform: translate(10px, -130%); }
.demo-band { position: absolute; top: 48px; left: max(10px, env(safe-area-inset-left, 0px)); right: 10px; max-width: 330px; background: rgba(13,18,23,0.86); color: var(--vp-ink); border: 1px solid rgba(255,255,255,0.12); border-radius: var(--r); padding: 10px 12px; font-size: 12px; }
.demo-band b { color: #fff; }
.demo-band .btn { margin-top: 8px; background: transparent; color: var(--vp-ink); border-color: rgba(255,255,255,0.3); }

aside.panel { display: grid; grid-template-rows: auto auto minmax(0, 1fr); min-height: 0; background: var(--panel); border-left: 1px solid var(--line); }
.editbar { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; padding: 8px 14px; border-bottom: 1px solid var(--line); background: var(--panel-2); font-size: 12px; color: var(--muted); }
.editbar strong { color: var(--ink); font-weight: 600; }
nav.tabs { display: flex; border-bottom: 1px solid var(--line); padding: 0 8px; overflow-x: auto; }
nav.tabs button { border: 0; background: none; padding: 10px 10px 9px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; font-weight: 500; white-space: nowrap; }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
nav.tabs .count { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-left: 4px; }
.tabbody { overflow-y: auto; min-height: 0; padding: 12px 14px 28px; display: flex; flex-direction: column; gap: 14px; }
.tabbody[hidden] { display: none; }
.search { width: 100%; padding: 6px 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel-2); }
.listbox { position: relative; border: 1px solid var(--line); border-radius: var(--r); max-height: 230px; overflow-y: auto; background: var(--panel-2); }
.listbox .row { display: flex; align-items: center; gap: 8px; padding: 3px 8px; cursor: pointer; font-family: var(--mono); font-size: 12px; border-bottom: 1px solid color-mix(in srgb, var(--line) 50%, transparent); }
.listbox .row:hover { background: var(--panel); }
.listbox .row[aria-selected="true"] { background: var(--accent-soft); color: var(--ink); }
.listbox .row .meta { margin-left: auto; color: var(--muted); font-size: 11px; font-family: var(--sans); display: flex; gap: 6px; align-items: center; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; box-shadow: 0 0 0 1px rgba(0,0,0,0.25); }
.card { border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); }
.card > header { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; padding: 10px 12px 8px; border-bottom: 1px solid var(--line); }
.card > header h3 { margin: 0; font-size: 15px; font-family: var(--mono); font-weight: 500; }
.card > header .sub { color: var(--muted); font-size: 12px; }
.card section { padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.card section + section { border-top: 1px solid var(--line); }
h4 { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; color: var(--muted); display: flex; gap: 8px; align-items: center; }
h4 .right { margin-left: auto; font-weight: 400; letter-spacing: 0; }
.note { font-size: 12px; color: var(--muted); margin: 0; }
.note.warn { color: var(--warn); background: var(--warn-soft); padding: 6px 8px; border-radius: 4px; }
.note.err { color: var(--err); background: var(--err-soft); padding: 6px 8px; border-radius: 4px; }
.note.ok { color: var(--ok); background: var(--ok-soft); padding: 6px 8px; border-radius: 4px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 12px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; font-family: var(--mono); min-width: 0; overflow-wrap: anywhere; }
.prow { display: grid; grid-template-columns: minmax(0, 1fr) 96px; gap: 4px 8px; align-items: center; padding: 6px 0; border-top: 1px dashed var(--line); }
.prow:first-of-type { border-top: 0; }
.prow .pname { font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
.prow .pmeta { grid-column: 1 / 3; display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 11px; color: var(--muted); }
.prow input[type=range] { grid-column: 1 / 3; width: 100%; accent-color: var(--accent); }
input.num { width: 100%; padding: 3px 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel-2); font-family: var(--mono); font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; }
input.num:focus { background: var(--panel); }
.dof { display: grid; grid-template-columns: 70px minmax(0,1fr) 54px; gap: 2px 8px; align-items: center; padding: 6px 0; border-top: 1px dashed var(--line); }
.dof:first-of-type { border-top: 0; }
.dof .lab { font-size: 12px; font-weight: 500; display: flex; align-items: center; gap: 4px; }
.dof .val { font-family: var(--mono); font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; }
.dof .stats { grid-column: 1 / 4; font-size: 11px; color: var(--muted); font-family: var(--mono); display: flex; gap: 12px; flex-wrap: wrap; }
.dof input[type=range] { width: 100%; accent-color: var(--accent); }
.rangebar { grid-column: 1 / 4; position: relative; height: 16px; background: var(--panel-2); border-radius: 3px; border: 1px solid var(--line); overflow: hidden; }
.rangebar .orig { position: absolute; top: 3px; bottom: 3px; background: color-mix(in srgb, var(--muted) 35%, transparent); border-radius: 2px; }
.rangebar .cur { position: absolute; top: 0; bottom: 0; border: 2px solid var(--accent); border-radius: 3px; }
.rangebar .zero { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--ink); opacity: 0.5; }
.rangebar .ticks { position: absolute; inset: 0; display: flex; justify-content: space-between; padding: 0 3px; font-size: 9px; color: var(--muted); font-family: var(--mono); align-items: center; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.grid3 label, .field { display: flex; flex-direction: column; gap: 2px; font-size: 11px; color: var(--muted); min-width: 0; }
.field input:not([type=checkbox]):not([type=radio]):not([type=color]), .field select { padding: 4px 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel-2); font-size: 12px; min-width: 0; width: 100%; }
.field input[type=color] { width: 100%; height: 28px; padding: 0 2px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel-2); }
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.nudge { display: grid; grid-template-columns: 22px repeat(4, minmax(0, 1fr)) 70px; gap: 4px; align-items: center; font-size: 12px; }
.nudge b { font-family: var(--mono); font-weight: 500; color: var(--muted); }
.nudge .loc { font-family: var(--mono); text-align: right; font-variant-numeric: tabular-nums; font-size: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 4px 1px 8px; border: 1px solid var(--line); border-radius: 99px; font-family: var(--mono); font-size: 11px; background: var(--panel-2); }
.chip button { border: 0; background: none; cursor: pointer; color: var(--muted); padding: 0 4px; font-size: 13px; line-height: 1; }
.chip button:hover { color: var(--err); }
.filters { display: flex; flex-wrap: wrap; gap: 4px; }
.filters button { border: 1px solid var(--line); background: var(--panel-2); border-radius: 99px; padding: 2px 10px; cursor: pointer; font-size: 12px; color: var(--muted); }
.filters button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: color-mix(in srgb, var(--accent) 50%, transparent); }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); }
table.ptable { border-collapse: collapse; width: 100%; font-size: 12px; }
table.ptable th { position: sticky; top: 0; background: var(--panel-2); text-align: left; font-weight: 500; color: var(--muted); padding: 4px 6px; border-bottom: 1px solid var(--line); font-size: 11px; }
table.ptable td { padding: 2px 6px; border-bottom: 1px solid color-mix(in srgb, var(--line) 60%, transparent); }
table.ptable td.n { font-family: var(--mono); min-width: 150px; max-width: 220px; overflow-wrap: anywhere; }
table.ptable td input.num { min-width: 86px; }
table.ptable tr.changed td.n { color: var(--accent); font-weight: 500; }
table.ptable td.ro { font-family: var(--mono); color: var(--muted); text-align: right; }
.bulk { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; }
.bulk input.num { width: 80px; }
.stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 6px; }
.stat { border: 1px solid var(--line); border-radius: var(--r); padding: 6px 8px; background: var(--panel-2); }
.stat b { display: block; font-family: var(--mono); font-size: 16px; font-weight: 500; font-variant-numeric: tabular-nums; }
.stat span { font-size: 11px; color: var(--muted); }
ul.log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
ul.log li { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 12px; }
ul.log li:first-child { border-top: 0; }
ul.log .tag { font-family: var(--mono); font-size: 10px; color: var(--muted); padding-top: 2px; }
ul.log .what { overflow-wrap: anywhere; }
ul.log .det { color: var(--muted); font-size: 11px; display: block; }
.issue { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; align-items: start; font-size: 12px; padding: 4px 0; }
.sev { font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 3px; letter-spacing: 0.04em; }
.sev.error { background: var(--err-soft); color: var(--err); } .sev.warn { background: var(--warn-soft); color: var(--warn); } .sev.info { background: var(--panel-2); color: var(--muted); }
.confirm { border: 1px solid color-mix(in srgb, var(--err) 50%, var(--line)); background: var(--err-soft); border-radius: var(--r); padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; font-size: 12px; }
.row-btns { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.empty-state { color: var(--muted); font-size: 12px; padding: 12px; border: 1px dashed var(--line); border-radius: var(--r); text-align: center; }
.overlay { position: fixed; inset: 0; background: rgba(10,14,18,0.55); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
.overlay[hidden] { display: none; }
.dialog { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; width: min(520px, 100%); max-height: 90vh; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 20px 50px rgba(0,0,0,0.35); }
.dialog h2 { margin: 0; font-size: 16px; font-weight: 600; }
.dropzone { position: fixed; inset: 0; z-index: 60; background: color-mix(in srgb, var(--accent) 22%, transparent); border: 3px dashed var(--accent); display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 600; color: var(--ink); pointer-events: none; }
.dropzone[hidden] { display: none; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--panel); padding: 8px 14px; border-radius: var(--r); font-size: 13px; z-index: 70; max-width: min(560px, calc(100% - 32px)); box-shadow: 0 6px 20px rgba(0,0,0,0.25); }
.toast[hidden] { display: none; }
.toast.err { background: var(--err); color: #fff; }
details.adv > summary { cursor: pointer; font-size: 12px; color: var(--muted); }
details.adv[open] > summary { margin-bottom: 6px; }
@media (max-width: 900px) {
  .app { height: auto; display: block; }
  main.work { display: block; }
  .viewport { height: 58vh; min-height: 320px; }
  aside.panel { display: block; border-left: 0; border-top: 1px solid var(--line); }
  .tabbody { overflow: visible; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .vp-legend, .vp-hint, .demo-band { display: none; }
}
.demo-note { flex-basis: 100%; color: var(--warn); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div class="app" id="app">
  <header class="bar">
    <div class="brand"><b>VSK・VSS エディタ</b><span>Vicon Shogun のスケルトンファイルを編集</span></div>
    <div class="slots" id="slots"></div>
    <div class="actions">
      <label class="btn primary" for="fileInput">ファイルを開く</label>
      <input id="fileInput" type="file" accept=".vsk,.vss,.vst,.xml" multiple hidden>
      <button class="btn" id="undoBtn" title="元に戻す (Ctrl+Z)" disabled>元に戻す</button>
      <button class="btn" id="redoBtn" title="やり直し (Ctrl+Shift+Z)" disabled>やり直し</button>
      <button class="btn" id="exportBtn" disabled>書き出し</button>
    </div>
  </header>
  <main class="work">
    <section class="viewport" id="viewport" aria-label="3D ビュー">
      <canvas id="cv"></canvas>
      <div class="vp-tools">
        <div class="seg-ctl" role="group" aria-label="視点">
          <button data-view="front">正面</button><button data-view="side">側面</button><button data-view="top">上</button><button data-view="persp" aria-pressed="true">斜め</button>
        </div>
        <div class="seg-ctl" role="group" aria-label="表示">
          <label><input type="checkbox" id="optLabels" checked>名前</label>
          <label><input type="checkbox" id="optSticks" checked>スティック</label>
          <label><input type="checkbox" id="optGhost" checked>ペアを重ねる</label>
        </div>
        <div class="seg-ctl"><button id="focusBtn">選択に寄る</button><button id="fitBtn">全体</button></div>
      </div>

        <div><button class="btn small" id="hideDemoBand">閉じる</button></div>
      </div>

    </section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
/* KinematicModel engine: parse / evaluate / edit / serialize Vicon VST・VSK・VSS */
'use strict';
const KM = (() => {

  /* ---------- number formatting ---------- */
  // C printf("%.17g") compatible (the format Shogun writes)
  function g17(x) {
    if (typeof x !== 'number' || !isFinite(x)) return String(x);
    if (Object.is(x, -0)) return '-0';
    if (x === 0) return '0';
    const s = x.toExponential(16);
    const k = s.indexOf('e');
    const ex = parseInt(s.slice(k + 1), 10);
    if (ex < -4 || ex >= 17) {
      let m = s.slice(0, k);
      if (m.includes('.')) m = m.replace(/0+$/, '').replace(/\.$/, '');
      return m + 'e' + (ex < 0 ? '-' : '+') + String(Math.abs(ex)).padStart(2, '0');
    }
    let f = x.toFixed(Math.max(0, 16 - ex));
    if (f.includes('.')) f = f.replace(/0+$/, '').replace(/\.$/, '');
    return f;
  }
  function nums(str) { return str == null || str.trim() === '' ? [] : str.trim().split(/\s+/).map(Number); }
  function joinG(arr) { return arr.map(g17).join(' '); }

  /* ---------- expressions ---------- */
  const FUNCS = { cos: Math.cos, sin: Math.sin, tan: Math.tan, acos: Math.acos, asin: Math.asin, atan: Math.atan,
    sqrt: Math.sqrt, abs: Math.abs, exp: Math.exp, log: Math.log, atan2: Math.atan2, pow: Math.pow, min: Math.min, max: Math.max };
  function tokenize(s) {
    const out = []; let i = 0;
    while (i < s.length) {
      const c = s[i];
      if (c === ' ' || c === '\t' || c === '\n' || c === '\r') { i++; continue; }
      if (/[0-9.]/.test(c)) {
        const m = /^(\d+\.?\d*|\.\d+)([eE][-+]?\d+)?/.exec(s.slice(i));
        if (!m) throw new Error('数値を読めません: ' + s);
        out.push({ t: 'num', v: parseFloat(m[0]) }); i += m[0].length; continue;
      }
      if (c === "'") {
        const j = s.indexOf("'", i + 1); if (j < 0) throw new Error('引用符が閉じていません: ' + s);
        out.push({ t: 'id', v: s.slice(i + 1, j) }); i = j + 1; continue;
      }
      if (/[A-Za-z_]/.test(c)) {
        const m = /^[A-Za-z_][A-Za-z0-9_]*/.exec(s.slice(i));
        out.push({ t: 'id', v: m[0] }); i += m[0].length; continue;
      }
      if ('+-*/^(),'.includes(c)) { out.push({ t: c }); i++; continue; }
      throw new Error('式に使えない文字 "' + c + '": ' + s);
    }
    return out;
  }
  function parse(s) {
    const tk = tokenize(s); let p = 0;
    const peek = () => tk[p] && tk[p].t;
    function expr() { let a = term(); while (peek() === '+' || peek() === '-') { const op = tk[p++].t; a = { t: 'bin', op, a, b: term() }; } return a; }
    function term() { let a = unary(); while (peek() === '*' || peek() === '/') { const op = tk[p++].t; a = { t: 'bin', op, a, b: unary() }; } return a; }
    function unary() { if (peek() === '-') { p++; return { t: 'neg', a: unary() }; } if (peek() === '+') { p++; return unary(); } return power(); }
    function power() { const a = primary(); if (peek() === '^') { p++; return { t: 'bin', op: '^', a, b: unary() }; } return a; }
    function primary() {
      const k = tk[p++];
      if (!k) throw new Error('式が途中で終わっています: ' + s);
      if (k.t === 'num') return { t: 'num', v: k.v };
      if (k.t === 'id') {
        if (peek() === '(' && FUNCS[k.v]) {
          p++; const args = [];
          if (peek() !== ')') { args.push(expr()); while (peek() === ',') { p++; args.push(expr()); } }
          if (tk[p++]?.t !== ')') throw new Error('")" がありません: ' + s);
          return { t: 'call', f: k.v, args };
        }
        return { t: 'id', n: k.v };
      }
      if (k.t === '(') { const e = expr(); if (tk[p++]?.t !== ')') throw new Error('")" がありません: ' + s); return e; }
      throw new Error('式を解釈できません: ' + s);
    }
    const e = expr(); if (p !== tk.length) throw new Error('式の末尾に余分な記号があります: ' + s);
    return e;
  }
  function evalAst(a, look) {
    switch (a.t) {
      case 'num': return a.v;
      case 'id': return look(a.n);
      case 'neg': return -evalAst(a.a, look);
      case 'call': return FUNCS[a.f](...a.args.map(x => evalAst(x, look)));
      case 'bin': {
        const x = evalAst(a.a, look), y = evalAst(a.b, look);
        switch (a.op) { case '+': return x + y; case '-': return x - y; case '*': return x * y; case '/': return x / y; case '^': return Math.pow(x, y); }
      }
    }
    return NaN;
  }
  function namesOf(a, set) {
    if (a.t === 'id') set.add(a.n);
    else if (a.t === 'neg') namesOf(a.a, set);
    else if (a.t === 'bin') { namesOf(a.a, set); namesOf(a.b, set); }
    else if (a.t === 'call') a.args.forEach(x => namesOf(x, set));
    return set;
  }
  const cache = new Map();
  function compile(s) {
    let c = cache.get(s);
    if (!c) {
      try { const ast = parse(s); c = { ast, names: [...namesOf(ast, new Set())], err: null }; }
      catch (e) { c = { ast: null, names: [], err: e.message }; }
      cache.set(s, c);
    }
    return c;
  }
  // split a vector attribute into its component expressions (whitespace at paren depth 0)
  function splitTop(v) {
    const out = []; let depth = 0, cur = '';
    for (const ch of v) {
      if (ch === '(') depth++; else if (ch === ')') depth--;
      if ((ch === ' ' || ch === '\t') && depth === 0) { if (cur) { out.push(cur); cur = ''; } }
      else cur += ch;
    }
    if (cur) out.push(cur);
    return out;
  }
  const NUMRE = /^[-+]?(\d+\.?\d*|\.\d+)([eE][-+]?\d+)?$/;
  const isNumStr = s => NUMRE.test(s);

  /* ---------- small linear algebra (row-major 3x3 + translation) ---------- */
  const I3 = () => [1, 0, 0, 0, 1, 0, 0, 0, 1];
  function mul3(A, B) {
    const C = new Array(9);
    for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) C[r * 3 + c] = A[r * 3] * B[c] + A[r * 3 + 1] * B[3 + c] + A[r * 3 + 2] * B[6 + c];
    return C;
  }
  const mv3 = (A, v) => [A[0] * v[0] + A[1] * v[1] + A[2] * v[2], A[3] * v[0] + A[4] * v[1] + A[5] * v[2], A[6] * v[0] + A[7] * v[1] + A[8] * v[2]];
  const mtv3 = (A, v) => [A[0] * v[0] + A[3] * v[1] + A[6] * v[2], A[1] * v[0] + A[4] * v[1] + A[7] * v[2], A[2] * v[0] + A[5] * v[1] + A[8] * v[2]];
  function axisAngle(ax, ang) {
    const n = Math.hypot(ax[0], ax[1], ax[2]); if (n < 1e-12 || Math.abs(ang) < 1e-15) return I3();
    const x = ax[0] / n, y = ax[1] / n, z = ax[2] / n, c = Math.cos(ang), s = Math.sin(ang), t = 1 - c;
    return [t * x * x + c, t * x * y - s * z, t * x * z + s * y, t * x * y + s * z, t * y * y + c, t * y * z - s * x, t * x * z - s * y, t * y * z + s * x, t * z * z + c];
  }
  function rotvec(r) { const a = Math.hypot(r[0], r[1], r[2]); return a < 1e-15 ? I3() : axisAngle(r, a); }
  const tf = (R, t) => ({ R, t });
  const compose = (A, B) => ({ R: mul3(A.R, B.R), t: [...mv3(A.R, B.t)].map((v, i) => v + A.t[i]) });
  const apply = (T, p) => mv3(T.R, p).map((v, i) => v + T.t[i]);
  const invApply = (T, p) => mtv3(T.R, [p[0] - T.t[0], p[1] - T.t[1], p[2] - T.t[2]]);
  const ID = () => tf(I3(), [0, 0, 0]);

  /* ---------- XML helpers ---------- */
  const kids = (el, tag) => { const o = []; for (const c of el.children) if (!tag || c.tagName === tag) o.push(c); return o; };
  const kid = (el, tag) => { for (const c of el.children) if (c.tagName === tag) return c; return null; };
  function indentOf(el) { const p = el.previousSibling; return p && p.nodeType === 3 ? p.data : null; }
  function insertAfter(ref, el) {
    const parent = ref.parentNode, ws = indentOf(ref) ?? '\n', next = ref.nextSibling;
    parent.insertBefore(ref.ownerDocument.createTextNode(ws), next); parent.insertBefore(el, next);
  }
  function appendChildIndented(parent, el) {
    const last = kids(parent).pop();
    if (last) { insertAfter(last, el); return; }
    const pin = (indentOf(parent) ?? '\n');
    if (!parent.firstChild) parent.appendChild(parent.ownerDocument.createTextNode(pin));
    parent.insertBefore(parent.ownerDocument.createTextNode(pin + '\t'), parent.lastChild);
    parent.insertBefore(el, parent.lastChild);
  }
  function removeEl(el) {
    const p = el.previousSibling;
    if (p && p.nodeType === 3 && /^\s*$/.test(p.data)) p.remove();
    el.remove();
  }
  const escAttr = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
  const escText = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  const JOINT_DOF = { JointFree: 6, JointBall: 3, JointHardySpicer: 2, JointHinge: 1, JointDummy: 0 };
  const POSE_ATTRS = ['PRE-POSITION', 'PRE-ORIENTATION', 'INVERSE-POST-POSITION', 'INVERSE-POST-ORIENTATION'];
  const COV_ATTRS = ['COVARIANCE', 'RANGE-MATRIX'];
  const CENTER_ATTRS = ['MEAN', 'RANGE-CENTRING-STATE'];

  /* ---------- Model ---------- */
  class Model {
    constructor(fileName, text) {
      this.fileName = fileName;
      this.ext = (fileName.split('.').pop() || '').toLowerCase();
      this.load(text);
      this.originalText = text;
      this.role = this.ext === 'vss' ? 'solving' : 'labeling';
      this.isTemplate = this.ext === 'vst' || /<!--/.test(this.prefix);
    }
    get baseName() { return this.fileName.replace(/\.[^.]+$/, ''); }
    load(text) {
      this.eol = text.includes('\r\n') ? '\r\n' : '\n';
      const rootIdx = text.indexOf('<KinematicModel');
      if (rootIdx < 0) throw new Error('KinematicModel 要素が見つかりません。VST / VSK / VSS ファイルを選んでください。');
      const endTag = '</KinematicModel>', endIdx = text.lastIndexOf(endTag);
      if (endIdx < 0) throw new Error('ファイルの末尾が欠けています（</KinematicModel> がありません）。');
      this.prefix = text.slice(0, rootIdx);
      this.suffix = text.slice(endIdx + endTag.length);
      const doc = new DOMParser().parseFromString(text.slice(rootIdx, endIdx + endTag.length), 'application/xml');
      const err = doc.getElementsByTagName('parsererror')[0];
      if (err) throw new Error('XML を読み込めません: ' + err.textContent.slice(0, 160));
      this.doc = doc; this.root = doc.documentElement;
      this.reindex();
    }
    serialize() {
      const eol = this.eol, out = [this.prefix];
      const ser = n => {
        if (n.nodeType === 1) {
          out.push('<', n.tagName);
          for (const a of n.attributes) out.push(' ', a.name, '="', escAttr(a.value), '"');
          if (!n.firstChild) out.push('/>');
          else { out.push('>'); for (let c = n.firstChild; c; c = c.nextSibling) ser(c); out.push('</', n.tagName, '>'); }
        } else if (n.nodeType === 3) out.push(eol === '\n' ? escText(n.data) : escText(n.data).replace(/\n/g, eol));
        else if (n.nodeType === 8) out.push('<!--', n.data, '-->');
        else if (n.nodeType === 4) out.push('<![CDATA[', n.data, ']]>');
      };
      ser(this.root); out.push(this.suffix);
      return out.join('');
    }

    reindex() {
      const R = this.root;
      this.paramsEl = kid(R, 'Parameters');
      this.params = new Map();
      if (this.paramsEl) for (const el of kids(this.paramsEl)) if (el.tagName === 'Parameter' || el.tagName === 'StaticParameter') this.params.set(el.getAttribute('NAME'), el);
      // skeleton
      this.segments = new Map(); this.segList = [];
      const walk = (el, parent, depth) => {
        for (const c of kids(el, 'Segment')) {
          const joint = kids(c).find(x => x.tagName.startsWith('Joint')) || null;
          const seg = { name: c.getAttribute('NAME'), el: c, joint, jt: joint ? kid(joint, 'JointTemplate') : null, jointType: joint ? joint.tagName : null, parent, children: [], depth };
          this.segments.set(seg.name, seg); this.segList.push(seg);
          if (parent) parent.children.push(seg);
          walk(c, seg, depth + 1);
        }
      };
      const sk = kid(R, 'Skeleton'); if (sk) walk(sk, null, 0);
      // markers & sticks
      const ms = kid(R, 'MarkerSet');
      this.markersEl = ms ? kid(ms, 'Markers') : null; this.sticksEl = ms ? kid(ms, 'Sticks') : null;
      this.markers = new Map();
      if (this.markersEl) for (const el of kids(this.markersEl, 'Marker')) this.markers.set(el.getAttribute('NAME'), el);
      this.sticks = this.sticksEl ? kids(this.sticksEl, 'Stick') : [];
      // targets
      const ts = kid(R, 'TargetSet'); this.targetsEl = ts ? kid(ts, 'Targets') : null;
      this.targets = []; this.rigidBodies = [];
      if (this.targetsEl) for (const el of kids(this.targetsEl)) {
        if (el.tagName === 'TargetLocalPointToWorldPoint') this.targets.push({ el, marker: el.getAttribute('MARKER'), segment: el.getAttribute('SEGMENT'), name: el.getAttribute('NAME') });
        else if (el.tagName === 'TargetRigidBody') {
          const rb = { el, segment: el.getAttribute('SEGMENT'), name: el.getAttribute('NAME'), markers: kids(el, 'RigidBodyMarker').map(m => ({ el: m, marker: m.getAttribute('NAME') })) };
          this.rigidBodies.push(rb);
        }
      }
      this.targetsByMarker = new Map();
      for (const t of this.targets) { if (!this.targetsByMarker.has(t.marker)) this.targetsByMarker.set(t.marker, []); this.targetsByMarker.get(t.marker).push(t); }
      this.rbByMarker = new Map();
      for (const rb of this.rigidBodies) for (const m of rb.markers) this.rbByMarker.set(m.marker, { rb, m });
      // PCA joints
      this.pcaJoints = new Map();
      for (const p of R.getElementsByTagName('PcaControlledParams')) for (const j of (p.getAttribute('JOINT-NAMES') || '').trim().split(/\s+/)) if (j) this.pcaJoints.set(j, p.getAttribute('NAME'));
      this.buildRefs();
      this._pv = new Map();
    }

    /* every place an expression references a parameter */
    buildRefs() {
      const refs = new Map(); const add = (name, ref) => { if (!refs.has(name)) refs.set(name, []); refs.get(name).push(ref); };
      const scanVec = (el, attr, owner) => {
        const v = el.getAttribute(attr); if (v == null) return;
        splitTop(v).forEach((comp, i) => { if (!isNumStr(comp)) for (const n of compile(comp).names) add(n, { el, attr, comp: i, owner }); });
      };
      for (const s of this.segList) if (s.jt) for (const a of POSE_ATTRS) scanVec(s.jt, a, { kind: 'segment', name: s.name });
      for (const t of this.targets) scanVec(t.el, 'POSITION', { kind: 'target', name: t.name, marker: t.marker });
      for (const rb of this.rigidBodies) for (const m of rb.markers) scanVec(m.el, 'POSITION', { kind: 'target', name: rb.name, marker: m.marker });
      for (const [name, el] of this.params) { const ex = el.getAttribute('EXPRESSION'); if (ex) for (const n of compile(ex).names) add(n, { el, attr: 'EXPRESSION', comp: 0, owner: { kind: 'param', name } }); }
      this.refs = refs;
    }

    /* ---------- parameters ---------- */
    invalidate() { this._pv = new Map(); }
    pval(name, stack) {
      if (this._pv.has(name)) return this._pv.get(name);
      const el = this.params.get(name); let v = NaN;
      if (el) {
        const ex = el.getAttribute('EXPRESSION');
        // a stored VALUE wins over EXPRESSION (Shogun evaluates the joints from VALUE)
        if (ex && !el.hasAttribute('VALUE')) {
          stack = stack || new Set(); if (stack.has(name)) return NaN; stack.add(name);
          const c = compile(ex); v = c.ast ? evalAst(c.ast, n => this.pval(n, stack)) : NaN;
        } else v = parseFloat(el.getAttribute('VALUE'));
      }
      this._pv.set(name, v); return v;
    }
    look() { return n => this.pval(n); }
    evalVec(str) {
      return splitTop(str || '').map(c => isNumStr(c) ? parseFloat(c) : (compile(c).ast ? evalAst(compile(c).ast, this.look()) : NaN));
    }
    paramInfo(name) {
      const el = this.params.get(name); if (!el) return null;
      const g = a => el.getAttribute(a);
      return { name, el, isStatic: el.tagName === 'StaticParameter', value: this.pval(name), valueStr: g('VALUE'), prior: g('PRIOR') != null ? parseFloat(g('PRIOR')) : null,
        sd: g('SD') != null ? parseFloat(g('SD')) : null, expression: g('EXPRESSION'), hidden: g('HIDDEN') === 'true', quantity: g('QUANTITY'), refs: this.refs.get(name) || [] };
    }
    paramGroup(name) {
      if (/^Scaling_/.test(name)) return 'scale';
      if (/HandShapeCoef_\d+$/.test(name)) return 'hand';
      if (/^Target_[XYZ]_/.test(name)) return 'finger';
      if (/^LabelingCluster_/.test(name)) return 'cluster';
      if (/^[A-Z0-9]+_[A-Za-z0-9]+_(Dynamic_)?[XYZ]$/.test(name)) return 'marker';
      return 'body';
    }

    /* re-evaluate the numeric joint attributes from their JointTemplate expressions */
    syncJoints() {
      let changed = 0;
      for (const s of this.segList) {
        if (!s.jt || !s.joint) continue;
        for (const a of POSE_ATTRS) {
          const tv = s.jt.getAttribute(a); if (tv == null) continue;
          const comps = splitTop(tv); if (comps.every(isNumStr)) continue;
          const v = this.evalVec(tv); if (v.some(x => !isFinite(x))) continue;
          const cur = nums(s.joint.getAttribute(a));
          const same = cur.length === v.length && cur.every((x, i) => x === v[i] || Math.abs(x - v[i]) <= 1e-12 * Math.max(1, Math.abs(v[i])));
          if (!same) { s.joint.setAttribute(a, joinG(v)); changed++; }
        }
      }
      return changed;
    }

    /* ---------- kinematics (display) ---------- */
    jointDofTransform(seg, q) {
      const j = seg.joint; if (!j || !q) return ID();
      switch (seg.jointType) {
        case 'JointHinge': return tf(axisAngle(nums(j.getAttribute('AXIS')), q[0] || 0), [0, 0, 0]);
        case 'JointHardySpicer': { const a = nums(j.getAttribute('AXIS-PAIR')); return tf(mul3(axisAngle(a.slice(0, 3), q[0] || 0), axisAngle(a.slice(3, 6), q[1] || 0)), [0, 0, 0]); }
        case 'JointBall': return tf(rotvec([q[0] || 0, q[1] || 0, q[2] || 0]), [0, 0, 0]);
        case 'JointFree': return tf(rotvec([q[0] || 0, q[1] || 0, q[2] || 0]), [q[3] || 0, q[4] || 0, q[5] || 0]);
      }
      return ID();
    }
    computeWorld(pose) {
      const W = new Map();
      for (const s of this.segList) {
        const j = s.joint; const P = s.parent ? W.get(s.parent.name) : ID();
        if (!j) { W.set(s.name, P); continue; }
        const pp = nums(j.getAttribute('PRE-POSITION')), po = nums(j.getAttribute('PRE-ORIENTATION'));
        const ip = nums(j.getAttribute('INVERSE-POST-POSITION')), io = nums(j.getAttribute('INVERSE-POST-ORIENTATION'));
        let M = compose(P, tf(rotvec(po.length === 3 ? po : [0, 0, 0]), pp.length === 3 ? pp : [0, 0, 0]));
        if (pose && pose[s.name]) M = compose(M, this.jointDofTransform(s, pose[s.name]));
        if (ip.length === 3 || io.length === 3) M = compose(M, tf(rotvec(io.length === 3 ? io : [0, 0, 0]), ip.length === 3 ? ip : [0, 0, 0]));
        W.set(s.name, M);
      }
      return W;
    }

  async function doExport() {

    const done = (what) => { msg.textContent = what; addLog('書き出し ' + files.map(f => f.name).join('、'), what, '—'); };
    const zipName = `${files[0].name.replace(/\.[^.]+$/, '')}_${stamp()}.zip`;
    const makeZip = async () => { const zip = new JSZip(); for (const f of files) zip.file(f.name, f.text); return zip.generateAsync({ type: 'blob', compression: 'DEFLATE' }); };

      try { await dl.save({ filename: zipName, data: await makeZip() }); done('保存しました: ' + zipName); }

  }
